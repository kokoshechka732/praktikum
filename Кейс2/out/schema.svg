<text x="48" y="762" font-size="12" fill="#54606e">Заявка отклонена — 63 кейса (6,3 %): 45 после первичной проверки, 18 после согласования руководителем.</text>
<text x="48" y="781" font-size="12" fill="#54606e">Доработка заявки — 156 кейсов, 174 задания (18 кейсов проходили цикл дважды); все возвраты идут с этапа согласования.</text>
<text x="48" y="800" font-size="12" fill="#54606e">Дополнительное согласование (20,9 % заявок): порог 150 000 объясняет 209 из 209 случаев ветки и ошибается на 19 кейсах,</text>
<text x="48" y="819" font-size="12" fill="#54606e">поэтому условие на схеме показано пунктиром как гипотеза, а не как установленное правило.</text>
